<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumo de Vendas - {{ COMPANY }}</title>
  <style>
    @media only screen and (max-width: 480px) {
      .outer-pad { padding: 10px 4px !important; }
      .card { width: 100% !important; max-width: 100% !important; }
      .header-pad { padding: 16px 12px 12px !important; }
      .content-pad { padding-left: 10px !important; padding-right: 10px !important; }
      .footer-pad { padding: 12px 10px 14px !important; }
      .mobile-title { font-size: 18px !important; }
      .mobile-small { font-size: 10px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f3; font-family: Arial, Helvetica, sans-serif;">
  <table class="outer-pad" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f3; padding:20px 8px;">
    <tr>
      <td align="center">
        <table class="card" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:640px; background-color:#ffffff; border-radius:8px; border:1px solid #e0dfd8;">
          <tr>
            <td class="header-pad" style="padding:20px 18px 14px; border-bottom:1px solid #e0dfd8;">
              <p class="mobile-small" style="margin:0 0 3px; font-size:11px; color:#b4b2a9; letter-spacing:0.04em; text-transform:uppercase;">Relatorio diario de vendas</p>
              <h1 class="mobile-title" style="margin:0 0 2px; font-size:20px; font-weight:600; color:#2c2c2a;">{{ COMPANY }}</h1>
              <p class="mobile-small" style="margin:0; font-size:12px; color:#888780;">{{ DATA_EMAIL }}</p>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:0 14px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed; border-collapse:collapse; font-size:10px; color:#b4b2a9; font-weight:500;">
                <tr>
                  <td width="31%" style="padding:8px 4px 4px 0;">&nbsp;</td>
                  <td width="24%" align="center" colspan="2" style="padding:8px 3px 2px; border-bottom:none; color:#2f6fbd; font-size:14px; font-weight:700;">2026</td>
                  <td width="24%" align="center" colspan="2" style="padding:8px 3px 2px; border-bottom:none; border-left:1px solid #e0dfd8; color:#2f6fbd; font-size:14px; font-weight:700;">2025</td>
                  <td width="21%" align="right" style="padding:8px 0 2px 3px; border-bottom:none; border-left:1px solid #e0dfd8; color:#2f6fbd; font-size:14px; font-weight:700;">2024</td>
                </tr>
                <tr style="border-bottom:1px solid #e0dfd8;">
                  <td style="padding:2px 4px 7px 0;"></td>
                  <td width="14%" align="right" style="padding:2px 3px 7px;">Valor</td>
                  <td width="10%" align="center" style="padding:2px 3px 7px;">Var.</td>
                  <td width="14%" align="right" style="padding:2px 3px 7px; border-left:1px solid #e0dfd8;">Valor</td>
                  <td width="10%" align="center" style="padding:2px 3px 7px;">Var.</td>
                  <td width="21%" align="right" style="padding:2px 0 7px 3px; border-left:1px solid #e0dfd8;">Valor</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:0 14px 16px;">
              {{ TABLE_ROWS }}
            </td>
          </tr>
          <tr>
            <td class="footer-pad" style="padding:12px 14px 16px; border-top:1px solid #e0dfd8;">
              <p class="mobile-small" style="margin:0; font-size:10px; color:#b4b2a9; line-height:1.5;">
                Valores em EUR &nbsp;&middot;&nbsp; Fonte: Ons3_Dash.DocMovsAcum<br>
                Acumulado considera janeiro ate ao mes corrente. Variacao face ao mesmo periodo do ano anterior.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
